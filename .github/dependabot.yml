# Weekly dependency updates (package 3: site security). Grouped so one PR carries the routine minor/patch bumps;
# major versions come one by one. Every PR runs the full CI before anyone merges it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /bridge/app
    schedule:
      interval: weekly
      day: monday
