name: Undo branch checks
on:
  push:
    branches: [feat/undo-delete-current]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: undo-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
      SUPABASE_SECRET_KEY: ci-placeholder-not-a-real-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Lint changed deletion components
        run: npm run lint -- src/hooks/use-trades.tsx src/components/ui/undo-toast.tsx src/components/ui/confirm-dialog.tsx
      - name: TypeScript
        if: ${{ !cancelled() && success() }}
        run: npx tsc --noEmit
      - name: Production build
        if: ${{ !cancelled() && success() }}
        run: npm run build
