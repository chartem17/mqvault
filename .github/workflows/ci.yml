name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  prop-rule-migration:
    name: Prop rule migration SQL (disposable Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: prop_rules_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d prop_rules_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-disposable-only
      PGDATABASE: prop_rules_ci
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration test script
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: psql --set=ON_ERROR_STOP=1 --file=tests/prop-rule-settings-migration.sql

  bridge:
    name: MQVault Bridge (Windows, Python)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r bridge/app/requirements.txt
      - name: Read-only check (claims S1/S2)
        run: python -I bridge/prototype/check_readonly.py bridge/app/mqvault_bridge
      - name: Unit tests
        run: python -I bridge/app/tests/test_bridge.py -v
