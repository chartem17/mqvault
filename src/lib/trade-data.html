<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Vault — Artem Chekan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/correlation@1.0.0/dist/correlation.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');

    :root {
      --bg: #0a0a0f;
      --bg-2: #0f0f16;
      --bg-3: #12121c;
      --bg-4: #161626;
      --bg-5: #1a1a2e;
      --border: #1f1f33;
      --border-light: #2a2a44;
      --text: #e8e8f0;
      --text-dim: #8a8aa8;
      --text-dim: #5a5a7a;
      --accent: #00d4ff;
      --accent-2: #00ff9d;
      --accent-3: #ff006e;
      --accent-4: #ffbe00;
      --accent-5: #a855f7;
      --success: #00e676;
      --danger: #ff4757;
      --warning: #ffa502;
      --info: #00d4ff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

    /* Sidebar */
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      width: 220px; background: var(--bg-2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      z-index: 100;
    }
    .sidebar-header {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-btn {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 20px; color: var(--text-dim);
      text-decoration: none; font-size: 14px;
      transition: all 0.2s; cursor: pointer; border: none;
      background: none; width: 100%; text-align: left;
    }
    .nav-btn:hover { background: rgba(0,212,255,0.08); color: var(--text); }
    .nav-btn.active {
      background: rgba(0,212,255,0.12);
      color: var(--accent);
      border-right: 3px solid var(--accent);
    }
    .nav-icon { width: 18px; height: 18px; opacity: 0.8; }
    .nav-btn.active .nav-icon { opacity: 1; }

    /* Main */
    .main { margin-left: 220px; padding: 24px 32px; }
    .page-header {
      margin-bottom: 24px;
    }
    .page-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .page-subtitle { font-size: 13px; color: var(--text-dim); }

    /* Cards */
    .card {
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }
    .card-title { font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.8px; }
    .card-value { font-size: 28px; font-weight: 700; margin-top: 8px; }
    .card-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

    /* Grid layouts */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }

    /* KPI cards */
    .kpi-up { color: var(--success); }
    .kpi-down { color: var(--danger); }

    /* Tables */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; font-size: 11px; font-weight: 600;
      color: var(--text-dim); text-transform: uppercase;
      letter-spacing: 0.5px; padding: 12px 12px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 12px 12px; font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    tr:hover { background: rgba(0,212,255,0.03); }
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 600;
    }
    .badge-long { background: rgba(0,230,118,0.15); color: var(--success); }
    .badge-short { background: rgba(255,71,87,0.15); color: var(--danger); }
    .badge-forex { background: rgba(0,212,255,0.15); color: var(--info); }
    .badge-crypto { background: rgba(255,190,0,0.15); color: var(--accent-4); }
    .badge-comm { background: rgba(255,0,110,0.15); color: var(--accent-3); }
    .badge-index { background: rgba(168,85,247,0.15); color: var(--accent-5); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: none; transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: var(--bg); }
    .btn-primary:hover { background: #00b8e6; }
    .btn-secondary { background: var(--bg-5); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-5); }
    .btn-danger { background: rgba(255,71,87,0.15); color: var(--danger); }
    .btn-danger:hover { background: rgba(255,71,87,0.25); }
    .btn-icon { padding: 6px; border-radius: 6px; }
    .btn-icon:hover { background: var(--bg-4); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: none; justify-content: center; align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-3); border: 1px solid var(--border);
      border-radius: 16px; width: 520px; max-height: 85vh;
      overflow-y: auto; padding: 28px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    }
    .modal-header { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .form-group { margin-bottom: 14px; }

      display:
